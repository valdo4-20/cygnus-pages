<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="580" viewBox="0 0 520 580"  role="img" aria-labelledby="title description">
<title id="title">AURA do sphere.</title><desc id="description">A silhueta original do gato do “sphere.” com fones, cercada por círculos de cores chapadas, ruído de impressão e texturas gráficas. Sem braços, pernas ou corpo humano.</desc>
<style>
.cat-light{display:none}.animated .cat-light{display:inline}.animated .cat-light-strip{animation:cat-light-pass 3945ms linear both;transform-origin:120px 120px}@keyframes cat-light-pass{0%,20%{transform:translateX(-245px) skewX(-18deg)}70%,100%{transform:translateX(245px) skewX(-18deg)}}.cat-eye{transform-box:fill-box;transform-origin:center}.cat-head{transform-origin:120px 165px}.aura-rings{transform-origin:260px 290px}
.animated .cat-head{animation:listen 3945ms ease-in-out both}.animated .cat-eye{animation:eyes 3945ms ease-in-out both}.animated .headphones{animation:phones 3945ms ease-in-out both}.animated .aura-rings{animation:rings 3945ms ease-in-out both}.animated .ink-shadow{animation:ink 3945ms steps(8,end) both}.animated .grain{animation:grain 700ms steps(3,end) infinite}
@keyframes listen{0%,22%,100%{transform:rotate(0)}36%,65%{transform:rotate(-5deg) translateY(2px)}50%,80%{transform:rotate(5deg)}}
@keyframes eyes{0%,22%,88%,100%{transform:scaleY(1)}32%,78%{transform:scaleY(.08)}}
@keyframes phones{0%,8%{opacity:0;transform:translateY(-50px)}24%,100%{opacity:1;transform:translateY(0)}}
@keyframes rings{0%{transform:scale(.82)}35%{transform:scale(1)}65%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ink{0%,100%{transform:translate(5px,7px)}45%{transform:translate(-6px,6px)}70%{transform:translate(8px,4px)}}
@keyframes grain{0%,100%{transform:translate(0)}33%{transform:translate(-2px,1px)}66%{transform:translate(1px,-2px)}}
@media(prefers-reduced-motion:reduce){.animated .cat-head,.animated .cat-eye,.animated .headphones,.animated .aura-rings,.animated .ink-shadow,.animated .grain,.animated .cat-light-strip{animation:none}.animated .cat-light{display:none}}
</style>
