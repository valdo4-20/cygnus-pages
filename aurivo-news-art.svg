<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#fff4df"/><circle cx="14" cy="14" r="1.4" fill="#fff4df"/></pattern>
<pattern id="squiggles" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M5-4q-6 5 0 9t0 9 0 9 0 9M21-9q6 5 0 9t0 9 0 9 0 9" fill="none" stroke="#ffb3c7" stroke-width="1.2" opacity=".8"/></pattern>
<pattern id="marks" width="22" height="22" patternUnits="userSpaceOnUse"><path d="m4 3 3 5m3-7 3 5m-9 8 3 5m8-7 3 5" stroke="#0874d8" stroke-width="1.3" opacity=".38"/></pattern>
<linearGradient id="cat-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a1caff" stop-opacity="0"/><stop offset=".28" stop-color="#76c6ff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff8dd" stop-opacity=".9"/><stop offset=".72" stop-color="#d5b6ff" stop-opacity=".35"/><stop offset="1" stop-color="#d5b6ff" stop-opacity="0"/></linearGradient><clipPath id="cat-light-clip"><use xlink:href="#logo"/></clipPath><filter id="ink"><feFlood flood-color="#10111b"/><feComposite in2="SourceAlpha" operator="in"/></filter>
